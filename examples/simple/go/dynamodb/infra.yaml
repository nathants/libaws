name: test-infraset-${uid}

dynamodb:
  test-table-${uid}:
    key:
      - userid:s:hash
      - version:n:range
    attr:
      - stream=keys_only
  test-other-table-${uid}:
    key:
      - userid:s:hash

s3:
  test-failed-events-${uid}:
    attr:
      - acl=private
      - metrics=false

lambda:
  test-lambda-${uid}:
    entrypoint: main.go
    attr:
      - memory=128
      - timeout=60
    policy:
      - AWSLambdaBasicExecutionRole
      - AWSLambdaDynamoDBExecutionRole
    allow:
      - dynamodb:GetItem arn:aws:dynamodb:*:*:table/test-table-${uid}
      - dynamodb:PutItem arn:aws:dynamodb:*:*:table/test-other-table-${uid}
      - s3:PutObject arn:aws:s3:::test-failed-events-${uid}/*
      - s3:ListBucket arn:aws:s3:::test-failed-events-${uid}
    trigger:
      - type: dynamodb
        attr:
          - test-table-${uid}
          - start=trim_horizon
          - batch=1
          - parallel=10
          # Retain the complete invocation after three failed retries.
          - retry=3
          - on-failure=arn:aws:s3:::test-failed-events-${uid}
          - window=1
    env:
      - uid=${uid}
