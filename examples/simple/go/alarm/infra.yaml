name: test-infraset-${uid}

lambda:
  test-lambda-${uid}:
    entrypoint: main.go
    attr:
      - memory=128
      - timeout=60
    policy:
      - AWSLambdaBasicExecutionRole
    trigger:
      - type: alarm
        attr:
          - name=test-alarm-invocations-${uid}
          - lambda-invocations=test-lambda-${uid}
          - at-least=1/minute
      - type: alarm
        attr:
          - name=test-alarm-invocations_${uid}
          - lambda-invocations=test-lambda-${uid}
          - at-least=2147483647/minute
      - type: alarm
        attr:
          - name=${long_alarm_name}
          - lambda-invocations=test-lambda-${uid}
          - at-least=2147483647/minute
    env:
      - uid=${uid}
