name: test-retention-${uid}

dynamodb:
  test-retention-${uid}:
    key: [id:s:hash]
    attr: [stream=new_and_old_images]

s3:
  test-retention-${uid}:
    attr: [acl=private, metrics=false]

lambda:
  test-notify-${uid}:
    entrypoint: ../../simple/go/alarm/main.go
    policy: [AWSLambdaBasicExecutionRole]
    trigger:
      - type: alarm
        attr:
          - name=test-retained-${uid}
          - lambda-retained-failures=test-retention-${uid}
          - dynamodb-table=test-retention-${uid}
          - at-least=1/minute
      - type: alarm
        attr:
          - name=test-delivery-${uid}
          - lambda-destination-delivery-failures=test-retention-${uid}
          - at-least=1/minute
      - type: alarm
        attr:
          - name=test-errors-${uid}
          - lambda-errors=test-retention-${uid}
          - at-least=1/minute
      - type: alarm
        attr:
          - name=test-age-${uid}
          - lambda-iterator-age=test-retention-${uid}
          - at-least=10s
    env: ["uid=${uid}"]

  test-retention-${uid}:
    entrypoint: main.go
    policy: [AWSLambdaBasicExecutionRole, AWSLambdaDynamoDBExecutionRole]
    allow:
      - s3:PutObject arn:aws:s3:::test-retention-${uid}/*
      - s3:ListBucket arn:aws:s3:::test-retention-${uid}
    trigger:
      - type: dynamodb
        attr:
          - test-retention-${uid}
          - start=trim_horizon
          - batch=1
          - retry=1
          - metrics=event_count
          - on-failure=arn:aws:s3:::test-retention-${uid}
