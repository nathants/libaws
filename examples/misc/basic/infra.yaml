name: test-infraset-${uid}

lambda:
  test-lambda-${uid}:
    entrypoint: main.py
    attr:
      - memory=128
      - timeout=60
      - logs-ttl-days=${logs_ttl_days}
    require:
      - --build-constraint=build-requirements.txt
      - -rrequirements.txt
    env:
      - uid=${uid}
      - ${lambda_environment}
    policy:
      - AWSLambdaBasicExecutionRole
