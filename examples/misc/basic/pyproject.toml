[project]
name = "libaws-lambda-require-example"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "py-util @ git+https://github.com/nathants/py-util@6844917fb51e9d24de130fd4728053d62c7946da",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "py-pool @ git+https://github.com/nathants/py-pool@27b31ec18b326366c8c405076963e2934dd7b134",
    "py-shell @ git+https://github.com/nathants/py-shell@dacb4922e13f947998ae31e40aec441c54471b36",
    "pytest==9.1.1",
    "pyyaml==6.0.2",
]

[tool.uv]
package = false
exclude-newer = "14 days"
