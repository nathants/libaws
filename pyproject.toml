[project]
name = "libaws-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "py-pool @ git+https://github.com/nathants/py-pool@27b31ec18b326366c8c405076963e2934dd7b134",
    "py-shell @ git+https://github.com/nathants/py-shell@dacb4922e13f947998ae31e40aec441c54471b36",
    "py-util @ git+https://github.com/nathants/py-util@115c1302c49c15ed5c46d5421f73022b5406096b",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
build = ["setuptools==83.0.0"]

[tool.uv]
build-constraint-dependencies = ["setuptools==83.0.0"]
package = false
exclude-newer = "14 days"
